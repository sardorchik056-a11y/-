services:
  - type: web
    name: telegram-bot
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: python main_webhook.py
    envVars:
      - key: WEBHOOK_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: CRYPTOBOT_TOKEN
        sync: false
      - key: PORT
        value: "10000"
